[project]
name = "loop-transformers"
version = "0.1.0"
description = "Stopgrad-truncated training of weight-tied looped transformers on prefix-product tasks"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]>=0.5.0",
    "flax>=0.10.2",
    "optax>=0.2.4",
    "orbax-checkpoint>=0.11.1",
    "numpy>=2.0",
    "wandb>=0.18",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loop_transformers"]
